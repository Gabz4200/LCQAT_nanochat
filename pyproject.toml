[project]
name = "nanochat"
version = "0.1.0"
description = "the minimal full-stack ChatGPT clone"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "filelock>=3.19.0",
    "jinja2>=3.1.6",
    "kernels>=0.11.7",
    "numpy>=1.26.0",
    "psutil>=7.1.0",
    "pyarrow>=21.0.0",
    "requests>=2.32.5",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "torch==2.9.1",
    "wandb>=0.21.3",
]

[dependency-groups]
dev = [
    "aislop>=0.16.1",
    "datasets>=5.0.1",
    "huggingface-hub>=0.34.4",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "pyrefly>=1.3.1",
    "pytest>=8.0.0",
    "python-dotenv>=1.2.1",
    "ruff>=0.16.9",
    "slangpy>=0.43.1",
]

[tool.ruff.lint]
# Explicit pragmatic policy for the existing codebase (this ruff build's default
# rule set is near-ALL, which would flag unrelated style in every legacy file).
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "E402",  # env vars (PYTORCH_ALLOC_CONF) must be set before imports
    "E731",  # lambda assignments are idiomatic in the training scripts
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# target torch to cuda 12.8 or CPU
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.optional-dependencies]
cpu = [
    "setuptools>=65.0.0",
    "torch==2.9.1",
]
gpu = [
    "torch==2.9.1",
]

[tool.uv]
default-groups = []
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

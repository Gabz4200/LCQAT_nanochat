# Canonical hook repos, pinned to dot-tags, fail_fast so a broken format/check
# stops the commit before slower hooks run (see user pre-commit preferences).
fail_fast: true

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: "1.3.1"
    hooks:
      - id: pyrefly-check
        name: pyrefly check (project env)
        # run in the project env so it checks against uv.lock's pyrefly
        language: system
        entry: uv run --no-sync pyrefly check
        pass_filenames: false
        always_run: true
  - repo: https://github.com/christophmeissner/pytest-pre-commit
    rev: 1.0.0
    hooks:
      - id: pytest
        name: pytest suite
        # Run with the project env (plugins + package installed) via uv.
        entry: uv run --no-sync pytest -q
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/scanaislop/aislop
    rev: v0.16.1
    hooks:
      - id: aislop
